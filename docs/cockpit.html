<!doctype html>
<!--
  ML3 リモート操縦コックピット / ML3 remote-operation cockpit (blue theme, JP/EN, fits one screen)

  使い方 / Usage (操縦者PC, ROS不要 / operator PC, no ROS):
    1) ブラウザで http://<ラズパイIP>:8000/ を開く（Pi が配信）。file:// でも可。
    2) 右上のホスト欄でIPを変更→「適用」で再接続。言語は右上トグルで JP/EN。
    3) 画面クリックでフォーカス → W/A/S/D 走行、矢印キーでアーム（離すと停止）。
    4) アーム: ▲▼(5°)/home/矢印キー(←→肩 ↑↓肘,押下中は連続)。LED on/off。動きはイージング。
  前提(Pi): cameras_launch.py(:8080) と teleop_launch.py(:9001) 起動済み。
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ML3 cockpit</title>
  <style>
    :root{
      --bg:#0a0e1a; --bg2:#070b13; --panel:#111a2e; --panel2:#0c1322;
      --line:#243252; --line2:#1a2440;
      --blue:#5b8def; --blue2:#7aa2ff; --green:#31d67a; --amber:#f5a623; --red:#ff6b6b;
      --txt:#e8edf7; --dim:#9aa6c2; --mute:#66728f;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --r:10px; --r2:14px; --gap:clamp(9px,1.2vw,16px);
    }
    *{box-sizing:border-box;margin:0}
    html,body{height:100%}
    body{background:radial-gradient(1400px 700px at 50% -15%,#0f1830 0%,var(--bg) 55%,var(--bg2) 100%);
         color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:14.5px}
    button{font-family:inherit}

    header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;
           padding:9px clamp(14px,2vw,26px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand .ico{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
                background:linear-gradient(160deg,#1b2748,#2a3c6e);border:1px solid #35497f}
    .brand .ico svg{width:21px;height:21px;stroke:var(--blue2);fill:none;stroke-width:2}
    .brand h1{font-family:var(--mono);font-size:clamp(16px,1.9vw,22px);letter-spacing:4px;font-weight:700;white-space:nowrap}
    .brand .sub{color:var(--dim);font-size:11.5px;margin-top:2px;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hdr-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
    .seg button{background:none;border:none;color:var(--dim);padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600}
    .seg button.on{background:var(--blue);color:#fff}
    .pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
          border-radius:999px;padding:7px 14px;font-size:12.5px;white-space:nowrap}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--mute);transition:.2s}
    .dot.ok{background:var(--green);box-shadow:0 0 9px var(--green)} .dot.bad{background:var(--red)}
    .host{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;white-space:nowrap}
    .host input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
                padding:7px 11px;font-family:var(--mono);font-size:13px;width:122px;outline:none}
    .host input:focus{border-color:var(--blue)}
    .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;
         padding:7px 13px;cursor:pointer;font-size:12.5px;transition:.15s}
    .btn:hover{border-color:var(--blue);color:#fff} .btn:active{transform:translateY(1px)}

    .stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);
           padding:var(--gap) clamp(14px,2vw,26px)}
    .cam{position:relative;background:#000;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;min-height:0}
    .cam img{width:100%;height:100%;object-fit:contain;display:block}
    .cam .live{position:absolute;top:10px;left:13px;display:flex;align-items:center;gap:7px;
               font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--mute)}
    .cam.on .live{color:var(--green)} .cam.on .live .dot{background:var(--green);box-shadow:0 0 9px var(--green)}
    .cam .side{position:absolute;top:9px;right:13px;font-size:13px;color:var(--txt);
               background:rgba(9,13,24,.6);padding:3px 10px;border-radius:8px;border:1px solid var(--line2)}
    .cam .reticle{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
    .cam .reticle i{width:min(16%,110px);aspect-ratio:1;border:1.5px solid var(--blue);border-radius:50%;opacity:.4}

    .dock{flex:none;display:flex;flex-direction:column;gap:9px;
          padding:9px clamp(14px,2vw,26px) 4px;border-top:1px solid var(--line)}
    .drow{display:flex;align-items:stretch;gap:var(--gap);flex-wrap:wrap}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:8px 13px;
          display:flex;flex-direction:column;gap:6px;justify-content:center}
    .card .cap{font-family:var(--mono);letter-spacing:2px;color:var(--blue2);font-size:11px;text-transform:uppercase}
    .card .body{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

    .pad{display:grid;grid-template-columns:repeat(3,32px);grid-auto-rows:32px;gap:5px}
    .key{display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);
         border-radius:8px;font-family:var(--mono);font-weight:700;font-size:14px;color:var(--dim);transition:.08s}
    .key.active{background:var(--blue);color:#fff;border-color:var(--blue2);box-shadow:0 0 12px rgba(91,141,239,.65);transform:translateY(1px)}
    .kw,.ku{grid-column:2;grid-row:1} .ka,.kl{grid-column:1;grid-row:2}
    .ks,.kd2{grid-column:2;grid-row:2} .kd,.kr{grid-column:3;grid-row:2}

    .axes{flex:1;min-width:220px}
    .axis{display:flex;align-items:center;gap:12px;margin:4px 0}
    .axis .lab{color:var(--dim);width:98px;font-size:12px;flex:none}
    .axis .lab b{color:var(--txt);font-family:var(--mono)}
    .bar{flex:1;height:8px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--line2)}
    .bar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
    .bar .fill{position:absolute;top:0;bottom:0;left:50%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:.06s linear}
    .axis .val{font-family:var(--mono);width:56px;text-align:right;font-size:13px}

    .arm-ctl{flex:1}
    .arm-ctl .body{gap:18px}
    .jt{display:flex;align-items:center;gap:7px}
    .jt .nm{color:var(--dim);font-size:12.5px;white-space:nowrap}
    .arm-ctl b{display:inline-block;min-width:2.6em;text-align:center;font-family:var(--mono);font-size:14.5px}
    .sbtn{font-size:15px;min-width:2.3em;padding:4px 9px;background:var(--panel2);color:var(--txt);
          border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:.12s}
    .sbtn:hover{border-color:var(--blue)} .sbtn:active{background:var(--blue);border-color:var(--blue2)}
    .home{color:var(--blue2);border-color:#35497f;font-size:13px}
    .led-on.act{color:#08120a;background:var(--green);border-color:var(--green)}
    .connect{align-self:stretch;background:var(--amber);color:#20160a;border:none;border-radius:12px;
             padding:0 22px;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;
             transition:.15s;white-space:nowrap}
    .connect:hover{filter:brightness(1.07)} .connect:active{transform:translateY(1px)}
    .connect.live{background:var(--panel);color:var(--green);border:1px solid var(--green)}

    footer{flex:none;color:var(--mute);font-size:11.5px;padding:3px clamp(14px,2vw,26px) 8px;text-align:center;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:640px){ .stage{grid-template-columns:1fr;grid-auto-rows:1fr} .brand .sub{display:none} }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"></circle><path d="M12 13v6M7 21h10M5 9a7 7 0 0 1 14 0"></path></svg></div>
      <div style="min-width:0"><h1>ML3 COCKPIT</h1><div class="sub" data-i18n="sub"></div></div>
    </div>
    <div class="hdr-right">
      <div class="seg"><button id="lang-ja">日本語</button><button id="lang-en">EN</button></div>
      <div class="pill"><span class="dot" id="wsdot"></span><span id="wstext"></span></div>
      <div class="host"><span data-i18n="host"></span><input id="host" spellcheck="false"></div>
      <button class="btn" id="apply" data-i18n="apply"></button>
    </div>
  </header>

  <div class="stage">
    <div class="cam" id="cam-front">
      <img id="front" alt=""><div class="live"><span class="dot"></span>LIVE</div>
      <div class="side" data-i18n="front"></div><div class="reticle"><i></i></div>
    </div>
    <div class="cam" id="cam-rear">
      <img id="rear" alt=""><div class="live"><span class="dot"></span>LIVE</div>
      <div class="side" data-i18n="rear"></div><div class="reticle"><i></i></div>
    </div>
  </div>

  <div class="dock">
    <div class="drow">
      <div class="card"><span class="cap" data-i18n="drive"></span>
        <div class="pad">
          <div class="key kw" id="key-w">W</div><div class="key ka" id="key-a">A</div>
          <div class="key ks" id="key-s">S</div><div class="key kd" id="key-d">D</div>
        </div></div>
      <div class="card"><span class="cap" data-i18n="armkeys"></span>
        <div class="pad">
          <div class="key ku" id="key-arrowup">↑</div><div class="key kl" id="key-arrowleft">←</div>
          <div class="key kd2" id="key-arrowdown">↓</div><div class="key kr" id="key-arrowright">→</div>
        </div></div>
      <div class="card axes">
        <div class="axis"><span class="lab"><span data-i18n="vx"></span> <b>vx</b></span><div class="bar"><div class="fill" id="bar-vx"></div></div><span class="val" id="val-vx">+0.00</span></div>
        <div class="axis"><span class="lab"><span data-i18n="wz"></span> <b>wz</b></span><div class="bar"><div class="fill" id="bar-wz"></div></div><span class="val" id="val-wz">+0.00</span></div>
      </div>
      <button class="connect" id="connect">⚡ <span id="connect-t"></span></button>
    </div>

    <div class="drow">
      <div class="card arm-ctl"><span class="cap" data-i18n="arm"></span>
        <div class="body">
          <div class="jt"><span class="nm" data-i18n="shoulder"></span>
            <button class="sbtn" data-joint="0" data-dir="-1">▼</button><b id="shv">90</b>°<button class="sbtn" data-joint="0" data-dir="1">▲</button></div>
          <div class="jt"><span class="nm" data-i18n="elbow"></span>
            <button class="sbtn" data-joint="1" data-dir="-1">▼</button><b id="elv">90</b>°<button class="sbtn" data-joint="1" data-dir="1">▲</button></div>
          <button class="sbtn home" id="home" data-i18n="home"></button>
          <div class="jt"><span class="nm">LED</span>
            <button class="sbtn led-on" id="ledon">on</button><button class="sbtn led-off" id="ledoff">off</button><b id="ledv">off</b></div>
        </div></div>
    </div>
  </div>

  <footer data-i18n="foot"></footer>

  <script>
    const $ = id => document.getElementById(id);
    const CAM_PORT = 8080, WS_PORT = 9001;
    const FRONT = "/front_camera/image_raw/compressed", REAR = "/rear_camera/image_raw/compressed";
    const LINEAR = 1.0, ANGULAR = 1.0, RATE_HZ = 20, STEP = 5, ARM_KEY_STEP = 1.5;
    let ELBOW_CCW = 1, SHOULDER_CCW = 1;
    let PI = location.hostname || "192.168.1.64";
    host.value = PI;

    const T = {
      sub:{ja:"KUAS MechLab3 遠隔操縦",en:"KUAS MechLab3 Teleoperation"},
      host:{ja:"接続先ホスト",en:"Host"}, apply:{ja:"適用",en:"Apply"},
      front:{ja:"前方",en:"FRONT"}, rear:{ja:"後方",en:"REAR"},
      drive:{ja:"走行 · DRIVE",en:"DRIVE"}, armkeys:{ja:"アーム · ARM",en:"ARM KEYS"},
      vx:{ja:"前後",en:"Fwd/Back"}, wz:{ja:"旋回",en:"Turn"},
      arm:{ja:"アーム · ARM",en:"ARM"}, shoulder:{ja:"肩 shoulder",en:"Shoulder"}, elbow:{ja:"肘 elbow",en:"Elbow"},
      home:{ja:"ホーム 90/90",en:"Home 90/90"},
      foot:{ja:"画面クリックでフォーカス → W/A/S/D 走行 ／ 矢印キー ←→肩・↑↓肘（押下中は連続、離すと停止・切断時も自動停止）",
            en:"Click to focus → W/A/S/D drives ／ arrows ←→ shoulder · ↑↓ elbow (hold to move; release stops, auto-stop on disconnect)"},
      wsdis:{ja:"WS 未接続",en:"WS offline"}, wswait:{ja:"接続中…",en:"connecting…"}, wsok:{ja:"接続",en:"online"},
      conn:{ja:"接続",en:"Connect"}, connlive:{ja:"接続中",en:"Connected"},
    };
    let LANG = localStorage.getItem("ml3lang") || "ja";
    let wsState = "bad";
    function renderWs(){ const d=$("wsdot"),t=$("wstext");
      d.className="dot"+(wsState==="ok"?" ok":wsState==="bad"?" bad":"");
      t.textContent = wsState==="ok" ? `${T.wsok[LANG]} (${PI})` : wsState==="wait" ? T.wswait[LANG] : T.wsdis[LANG]; }
    function renderConnect(){ $("connect").classList.toggle("live", wsState==="ok");
      $("connect-t").textContent = wsState==="ok" ? T.connlive[LANG] : T.conn[LANG]; }
    function applyLang(){
      document.documentElement.lang = LANG;
      document.querySelectorAll("[data-i18n]").forEach(el => { const t=T[el.dataset.i18n]; if(t) el.textContent=t[LANG]; });
      $("lang-ja").classList.toggle("on", LANG==="ja"); $("lang-en").classList.toggle("on", LANG==="en");
      renderWs(); renderConnect();
    }
    $("lang-ja").onclick = () => { LANG="ja"; localStorage.setItem("ml3lang",LANG); applyLang(); };
    $("lang-en").onclick = () => { LANG="en"; localStorage.setItem("ml3lang",LANG); applyLang(); };

    function loadCams(){ front.src=`http://${PI}:${CAM_PORT}/stream?topic=${FRONT}`; rear.src=`http://${PI}:${CAM_PORT}/stream?topic=${REAR}`; }
    front.onload=()=>$("cam-front").classList.add("on"); front.onerror=()=>$("cam-front").classList.remove("on");
    rear.onload =()=>$("cam-rear").classList.add("on");  rear.onerror =()=>$("cam-rear").classList.remove("on");
    loadCams();

    const keys = new Set();
    addEventListener("keydown", e=>{ keys.add(e.key.toLowerCase()); if(e.key.startsWith("Arrow")) e.preventDefault(); });
    addEventListener("keyup",   e=>keys.delete(e.key.toLowerCase()));
    addEventListener("blur", ()=>keys.clear());
    function currentAxes(){ let vx=0,wz=0; if(keys.has("w"))vx+=LINEAR; if(keys.has("s"))vx-=LINEAR; if(keys.has("a"))wz+=ANGULAR; if(keys.has("d"))wz-=ANGULAR; return {vx,wz}; }

    let ws=null, retry=null;
    function setWs(s){ wsState=s; renderWs(); renderConnect(); }
    function connect(){ clearTimeout(retry); if(ws){try{ws.onclose=null;ws.close();}catch(e){}}
      setWs("wait"); ws=new WebSocket(`ws://${PI}:${WS_PORT}`);
      ws.onopen=()=>setWs("ok"); ws.onclose=()=>{setWs("bad");retry=setTimeout(connect,1000);}; ws.onerror=()=>ws.close(); }
    const send = o => { if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(o)); };
    connect();

    function setBar(n,v){ const f=$("bar-"+n),w=Math.min(1,Math.abs(v))*50; f.style.width=w+"%"; f.style.left=(v<0?50-w:50)+"%"; $("val-"+n).textContent=(v>=0?"+":"")+v.toFixed(2); }
    setInterval(()=>{ const a=currentAxes(); send(a);
      ["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].forEach(k=>$("key-"+k).classList.toggle("active",keys.has(k)));
      setBar("vx",a.vx); setBar("wz",a.wz);
    }, 1000/RATE_HZ);
    addEventListener("beforeunload", ()=>send({vx:0,wz:0}));

    const arm=[90,90], armCur=[90,90];
    const clamp=a=>Math.max(0,Math.min(180,a));
    const round1=a=>Math.round(a*10)/10;
    function showArm(){ shv.textContent=Math.round(arm[0]); elv.textContent=Math.round(arm[1]); }
    const EASE=0.22;
    setInterval(()=>{ let ch=false;
      for(let i=0;i<2;i++){ const d=arm[i]-armCur[i]; if(Math.abs(d)>0.15){armCur[i]+=d*EASE;ch=true;} else if(armCur[i]!==arm[i]){armCur[i]=arm[i];ch=true;} }
      if(ch) send({servo:[round1(armCur[0]),round1(armCur[1])]});
    }, 1000/40);
    document.querySelectorAll(".arm-ctl button[data-joint]").forEach(b=>{
      b.addEventListener("click",()=>{ const j=Number(b.dataset.joint); arm[j]=clamp(arm[j]+STEP*Number(b.dataset.dir)); showArm(); b.blur(); });
    });
    home.addEventListener("click",()=>{ arm[0]=90; arm[1]=90; showArm(); home.blur(); });
    setInterval(()=>{ let ch=false;
      if(keys.has("arrowup")){arm[1]=clamp(arm[1]+ARM_KEY_STEP*ELBOW_CCW);ch=true;}
      if(keys.has("arrowdown")){arm[1]=clamp(arm[1]-ARM_KEY_STEP*ELBOW_CCW);ch=true;}
      if(keys.has("arrowleft")){arm[0]=clamp(arm[0]+ARM_KEY_STEP*SHOULDER_CCW);ch=true;}
      if(keys.has("arrowright")){arm[0]=clamp(arm[0]-ARM_KEY_STEP*SHOULDER_CCW);ch=true;}
      if(ch) showArm();
    }, 1000/RATE_HZ);

    function setLed(on){ ledv.textContent=on?"on":"off"; ledon.classList.toggle("act",on); ledoff.classList.toggle("act",!on); send({led:on}); }
    ledon.addEventListener("click",()=>{ setLed(true); ledon.blur(); });
    ledoff.addEventListener("click",()=>{ setLed(false); ledoff.blur(); });

    apply.addEventListener("click",()=>{ const h=host.value.trim(); if(h)PI=h; loadCams(); connect(); apply.blur(); });
    $("connect").addEventListener("click",()=>{ connect(); $("connect").blur(); });
    host.addEventListener("keydown", e=>{ if(e.key==="Enter") apply.click(); });

    applyLang();
  </script>
</body>
</html>
