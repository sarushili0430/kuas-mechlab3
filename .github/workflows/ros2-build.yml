name: ROS2 Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ros2-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  colcon-build-test:
    name: colcon build + test (humble)
    runs-on: ubuntu-22.04
    container:
      image: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and package dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_cohesion+

      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+
          # colcon test returns 0 even when tests fail; this surfaces failures
          # (with details) as a non-zero exit so the job fails correctly.
          colcon test-result --verbose
