[project]
name = "ml3-mcp"
version = "0.1.0"
description = "MCP server to drive the KUAS MechLab3 robot from a local Claude (stdio, no auth)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    # <14 keeps the legacy asyncio server API that mock_robot.py relies on.
    # The robot itself runs websockets 10.x; the client only needs connect().send().
    "websockets>=12.0,<14.0",
    "httpx>=0.27.0",
]

[project.scripts]
ml3-mcp = "ml3_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml3_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
